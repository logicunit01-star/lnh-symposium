# cPanel Apache include for symposium2027.lnh.edu.pk -> the Node app on 127.0.0.1:3000.
# Copy to BOTH:
#   /etc/apache2/conf.d/userdata/std/2_4/symposium2027/symposium2027.lnh.edu.pk/lnh-proxy.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/symposium2027/symposium2027.lnh.edu.pk/lnh-proxy.conf
# then: /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
# The /.well-known path stays with Apache so cPanel AutoSSL can issue and renew the certificate.
ProxyPreserveHost On
ProxyRequests Off
ProxyPass /.well-known !
ProxyPass / http://127.0.0.1:3000/ timeout=120
ProxyPassReverse / http://127.0.0.1:3000/
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
# uploads (abstract posters, agenda files) can be larger than the Apache default
LimitRequestBody 52428800
